services:
  mysql:
    image: mysql:latest
    container_name: snippetbox-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - snippetbox-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: snippetbox-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${APP_PORT:-4000}:4000"
    environment:
      DSN: ${MYSQL_USER:-web}:${MYSQL_PASSWORD:-pass}@tcp(mysql:3306)/${MYSQL_DATABASE:-snippetbox}?parseTime=true
    networks:
      - snippetbox-network
    volumes:
      - ./ui:/app/ui:ro

volumes:
  mysql_data:
    driver: local

networks:
  snippetbox-network:
    driver: bridge

